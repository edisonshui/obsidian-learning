<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../renderer/tokens.css">
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(../renderer/fonts/bricolage.woff2) format("woff2");font-weight:200 800}
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
/* The app icon: Paper, the Calm light as a bloom, and the wordmark's F in Ink. */
.tile{position:absolute;left:100px;top:100px;width:824px;height:824px;border-radius:186px;background:#F6F5F2;overflow:hidden;box-shadow:0 0 0 1px rgba(27,26,23,.08) inset}
.bloom{position:absolute;left:150px;top:110px;width:600px;height:600px;border-radius:50%;background:var(--holo-calm);filter:blur(70px);opacity:.95}
.f{position:absolute;inset:0;display:grid;place-items:center;font:700 560px/1 "Bricolage Grotesque";letter-spacing:-.04em;color:#1B1A17;padding-top:20px}
</style></head><body><div class="tile"><div class="bloom"></div><div class="f">F</div></div></body></html>
