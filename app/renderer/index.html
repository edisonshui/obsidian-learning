<div class="window" id="win">
  <aside class="sidebar" id="side" aria-label="Screens and subjects"></aside>
  <main class="panel" id="panel">
    <div class="dragbar" aria-hidden="true"></div>
    <section class="screen" id="screen" tabindex="-1"></section>
    <div class="islands hidden" id="islands"></div>
    <section class="session hidden" id="session">
      <div class="thread-scroll" id="threadScroll"><div class="thread" id="thread"></div></div>
      <button class="newpill" id="newPill" data-act="log-bottom"><svg class="i sm"><use href="#i-down"/></svg>New messages</button>
      <div class="dock" id="dock"><div class="dock-in">
        <div class="acts" id="acts"></div>
        <div class="composer" id="composer">
          <div class="attach" id="attach"></div>
          <div class="msg" id="msg" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Message to your tutor" data-placeholder="Reply to your tutor, or paste a screenshot" spellcheck="true"></div>
          <div class="composer-row">
            <button class="icon-btn" data-act="attach" aria-label="Attach a file" data-tip="Attach a file" data-tip-side="up"><svg class="i sm"><use href="#i-plus"/></svg></button>
            <button class="icon-btn" data-act="math" aria-label="Insert math" data-tip="Math  $ or ⌘E" data-tip-side="up"><svg class="i sm"><use href="#i-math"/></svg></button>
            <button class="model" id="model" data-act="model"></button>
            <button class="send" id="send" data-act="send" aria-label="Send" disabled><svg class="i sm"><use href="#i-send"/></svg></button>
          </div>
        </div>
      </div></div>
      <div class="drawer" id="drawer" aria-label="Terminal">
        <div class="drawer-head"><svg class="i sm"><use href="#i-terminal"/></svg><span id="drawerTitle">Terminal</span><span class="cap" id="drawerNote"></span><button class="icon-btn" data-act="toggle-term" aria-label="Close the terminal" data-tip="Close  Ctrl+`" data-tip-side="left-down"><svg class="i sm"><use href="#i-x"/></svg></button></div>
        <div class="termcard" id="termcard"><div id="term" style="height:100%"></div></div>
        <div class="drawer-empty" id="drawerEmpty"></div>
      </div>
    </section>
  </main>
  <aside class="plan hidden" id="plan" aria-label="This session's plan"></aside>
</div>
<div class="scrim" id="scrim"></div>
<div class="toast card float" id="toast" role="status" aria-live="polite"></div>

<script src="../node_modules/@xterm/xterm/lib/xterm.js"></script>
<script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
<script src="../node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
<script src="../node_modules/mathlive/mathlive.min.js"></script>
<script src="markdown.js"></script>
<script src="app.js"></script>
</body>
</html>
