# Builds Flash's installers on a Mac, a Windows, and a Linux machine.
# Runs on every push to vault-app that touches app/, on the Run workflow
# button (once this file is on main), and on a flash-v* tag, which also
# attaches the installers to a GitHub Release.
name: Build Flash

on:
  push:
    branches: [vault-app]
    paths: ["app/**", ".github/workflows/build-flash.yml"]
    tags: ["flash-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      # On Linux, node-pty has no prebuilt binary, so npm ci compiles it.
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v7
        with:
          name: flash-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.AppImage
            app/dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/flash-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - run: |
          gh release create "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY" \
            --title "Flash ${GITHUB_REF_NAME#flash-v}" \
            --notes "Unsigned builds. On macOS, right-click the app and choose Open. On Windows, choose More info, then Run anyway."
        env:
          GH_TOKEN: ${{ github.token }}
